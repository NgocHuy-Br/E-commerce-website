server:
  port: 8085

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3314/db_order
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50SldUU2VjcmV0S2V5Rm9yTmhom14}
  internal:
    key: ${INTERNAL_API_KEY:nhom14-development-internal-key}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  store-service:
    url: ${STORE_SERVICE_URL:http://localhost:8084}